name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE"

      - name: Build APK
        working-directory: DaftarMuhasabi
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp DaftarMuhasabi/app/build/outputs/apk/debug/app-debug.apk DaftarMuhasabi.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarMuhasabi-APK
          path: DaftarMuhasabi.apk
